name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract ZIP File
      run: |
        echo "Searching for ZIP file..."
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: No ZIP file found in the repository root!"
          exit 1
        fi
        echo "Found ZIP: $ZIP_FILE"
        unzip -q "$ZIP_FILE" -d extracted_project
        echo "Contents of extracted folder:"
        ls -la extracted_project

    - name: Find Project Root
      run: |
        PROJECT_DIR=$(find extracted_project -name "gradlew" -exec dirname {} \;)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
        fi
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: Could not locate Android project structure!"
          exit 1
        fi
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        echo "Project directory is: $PROJECT_DIR"

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "$PROJECT_DIR/gradlew" ]; then
          chmod +x "$PROJECT_DIR/gradlew"
        fi

    - name: Clean and Build APK
      run: |
        cd "$PROJECT_DIR"
        if [ -f "gradlew" ]; then
          ./gradlew clean assembleDebug --stacktrace
        else
          gradle clean assembleDebug --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
          
